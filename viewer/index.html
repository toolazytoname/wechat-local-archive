<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>匣 · 本地微信档案</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <header class="brand">
        <div class="seal">匣</div>
        <div>
          <h1>本地档案</h1>
          <p class="muted" id="meta-line">正在读取索引…</p>
        </div>
      </header>
      <label class="search">
        <span>会话</span>
        <input id="conv-q" type="search" placeholder="按名称筛选" autocomplete="off" />
      </label>
      <section class="pins" id="pins"></section>
      <nav class="convos" id="convos"></nav>
    </aside>
    <main class="stage">
      <header class="stage-bar">
        <div>
          <h2 id="chat-title">选择一个会话</h2>
          <p class="muted" id="chat-sub"></p>
        </div>
        <div class="toggles">
          <label class="check">
            <input type="checkbox" id="readable" checked />
            只看可读文字
          </label>
          <label class="search inline">
            <input id="msg-q" type="search" placeholder="搜索正文" autocomplete="off" />
          </label>
        </div>
      </header>
      <div id="search-hits" class="hits hidden"></div>
      <section class="thread" id="thread">
        <div class="empty">
          <p>这是一台电脑上的私人档案柜。</p>
          <p class="muted">数据不出网。媒体仍是占位说明，文字已解密。</p>
        </div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>

[project]
name = "wechat-export"
version = "0.2.0"
description = "Local WeChat backup/live-db export for an authorized personal account"
requires-python = ">=3.11"
dependencies = [
  "pycryptodome>=3.20",
  "zstandard>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wechat-export = "wechat_export.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wechat_export*"]

[tool.setuptools.package-data]
wechat_export = [
  "compatibility-registry.json",
  "static/*",
  "demo/*.json",
  "demo/*.db",
  "demo/*.md",
  "demo/all/*.jsonl",
  "demo/media/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
